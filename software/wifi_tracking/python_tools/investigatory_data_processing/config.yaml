# Investigatory data processing configuration.
# Consumed by live_plot.py and plot_existing_data.ipynb.

apply_smooth_filter: false           # moving-average denoising along subcarriers
apply_antialias: true              # low-pass Butterworth filter along frame axis
apply_cubic_spline_upsample: true  # cubic-spline upsampling along frame axis
plot_window: 200                    # rolling window depth (frames)
denom_ratio: 0.01                   # minimum denominator magnitude for ratio plots
